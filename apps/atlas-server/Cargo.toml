[package]
name = "atlas-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "atlas-server"

[features]
# Compiles the atlas-seed dev tool; never enabled by production builds.
seed-tool = ["dep:reqwest"]

[dependencies]
anyhow.workspace = true
atlas-classifiers = { path = "../../crates/atlas-classifiers" }
atlas-model = { path = "../../crates/atlas-model" }
atlas-storage = { path = "../../crates/atlas-storage" }
axum.workspace = true
bitcoin.workspace = true
clap.workspace = true
hex.workspace = true
reqwest = { workspace = true, features = ["blocking"], optional = true }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "atlas-seed"
required-features = ["seed-tool"]

[dev-dependencies]
atlas-agent = { path = "../atlas-agent" }
reqwest.workspace = true
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
