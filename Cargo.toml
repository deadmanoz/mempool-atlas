[workspace]
resolver = "3"
members = [
    "apps/atlas-agent",
    "apps/atlas-server",
    "crates/atlas-classifiers",
    "crates/atlas-model",
]
default-members = ["apps/atlas-agent", "apps/atlas-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
bitcoin = "0.32.7"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
prost = "0.14.1"
prost-build = "0.14"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
